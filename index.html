<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Drzewo rodziny Fleury–Zaniewski</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea;--grid:#e6dccb;--ink:#2a2620;--muted:#7a705f;--line:#ddd3bf;--card:#fffdf8;--stack:#efe8da;
  --fleury:#4b6a8a;--zan:#9a5a3a;--inlaw:#6b7a4c;--hyp:#9a917f;--gold:#b8892b;--wyg:#3d7a72;
  --edge:#8a8070;--edgeP:#bdb3a1;--edgeH:#c08a3e;--spouse:#b5566f;
  --C:#3f7a4f;--P:#4b6a8a;--H:#c08a3e;--FAM:#7a5a9a;--X:#b91c1c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
#top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:rgba(247,243,234,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
h1{font:700 24px "Cormorant Garamond",serif;margin:0 12px 0 0;white-space:nowrap;letter-spacing:.01em}
button,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input{width:160px}
#legend{position:absolute;left:12px;bottom:12px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.06);max-width:calc(100% - 24px)}
#legend .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0}
#legend.hide .body{display:none}
#legend svg{position:static;width:auto;height:auto;vertical-align:middle;margin-right:4px}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px}
#stage.drag{cursor:grabbing}
.node{cursor:pointer}
.node text{font-family:Inter,sans-serif;pointer-events:none}
.node text.nm{font:700 17px "Cormorant Garamond",serif;fill:var(--ink)}.fl{font-size:8px;font-weight:600;letter-spacing:.16em}
.node text.rn{font:700 15px "Cormorant Garamond",serif;fill:var(--ink)}.ry{font-size:10px;fill:var(--muted)}.sh{font-size:9.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}
.row .hit{fill:transparent}.row:hover .hit{fill:#ebe5da}.row.sel .hit{fill:#e3dccd}
.node.H text.nm,.node.NN text.nm{font-style:italic;fill:#5e5546}
.dt{font-size:10.5px;fill:var(--muted)}
.node.dim,.edge.dim,.union.dim{opacity:.13}
.node.sel .box{stroke:var(--ink)!important;stroke-width:1.6}.node .box{transition:stroke .15s}.node:hover .box{stroke:var(--muted)}
#panel{position:absolute;top:0;right:0;bottom:0;width:390px;max-width:100%;z-index:6;background:#fff;border-left:1px solid var(--line);transform:translateX(105%);transition:transform .2s;overflow:auto;padding:16px 18px 40px;box-shadow:-6px 0 22px rgba(0,0,0,.07)}
#panel.open{transform:none}
@media (max-width:700px){#panel{top:auto;left:0;width:100%;height:62%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}#panel.open{transform:none}input{width:110px}h1{font-size:19px}}
#panel h2{font:700 25px/1.1 "Cormorant Garamond",serif;margin:0 30px 4px 0}
#panel .close{position:absolute;top:10px;right:10px;border:0;font-size:22px;background:none}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;color:#fff;margin-right:6px;vertical-align:1px;white-space:nowrap}
.b-C{background:var(--C)}.b-P{background:var(--P)}.b-H{background:#fff;color:var(--H);border:1.5px dashed var(--H)}.b-FAM{background:var(--FAM)}.b-X{background:var(--X)}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:18px 0 6px}
#panel .todo li{padding:8px 10px;border:1px solid var(--line);border-radius:8px}#panel .tag{display:inline-block;font-size:11px;background:#fff4e0;color:#8a5a00;border-radius:6px;padding:1px 6px;margin-right:6px}
#panel ul{margin:0;padding:0;list-style:none}
#panel li{margin:0 0 9px}
li.q{background:#fffbeb;border:1px dashed #f0c27a;border-radius:8px;padding:6px 8px}
.src{font-size:11px;margin-top:2px}.src a{color:var(--fleury);margin-right:6px}
.rel a{color:var(--ink);text-decoration:underline dotted;cursor:pointer}
.ty{color:var(--muted);font-size:12px}
.sub{color:var(--muted)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
</style>
</head>
<body>
<div id="top">
  <h1>Ród Fleury – Zaniewski</h1>
  <button id="fit">Dopasuj</button>
  <button id="hyp" class="on" title="Pokaż/ukryj hipotezy i możliwe gałęzie">Hipotezy</button>
  <button id="line" title="Tylko linia bezpośrednia">Linia prosta</button>
  <button id="todo" title="Rzeczy, których nie dało się zrobić automatycznie">Do zrobienia</button>
  <input id="q" placeholder="Szukaj osoby…" list="names"><datalist id="names"></datalist>
</div>
<svg id="stage"><defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#3b2f1e" flood-opacity=".10"/></filter>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbfbfc"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eceef2" stroke-width="3"/></pattern>
</defs><g id="vp"><g id="edges"></g><g id="unions"></g><g id="nodes"></g></g></svg>
<div id="msg">Układam drzewo…</div>
<div id="legend"><div class="row" style="justify-content:space-between;margin:0"><b>Legenda</b><a href="#" id="lt" style="color:var(--muted)">ukryj</a></div>
 <div class="body">
  <div class="row">
   <span><svg width="34" height="18"><rect x="1" y="1" width="32" height="16" rx="3" fill="#fffdf8" stroke="#ddd3bf"/><circle cx="26" cy="9" r="4.5" fill="#3f7a4f"/></svg>potwierdzona</span>
   <span><svg width="34" height="18"><rect x="1" y="1" width="32" height="16" rx="3" fill="#fffdf8" stroke="#ddd3bf" stroke-opacity=".7"/><circle cx="26" cy="9" r="4.5" fill="#4b6a8a"/></svg>prawdopodobna</span>
   <span><svg width="34" height="18"><rect x="1" y="1" width="32" height="16" rx="4" fill="url(#hatch)" stroke="#c08a3e" stroke-width="1.3" stroke-dasharray="4 3"/></svg>hipoteza / nieznana</span>
   <span><svg width="34" height="18"><rect x="1" y="1" width="32" height="16" rx="3" fill="#fffdf8" stroke="#b8892b" stroke-width="1.4"/><rect x="3.5" y="3.5" width="27" height="11" rx="2" fill="none" stroke="#b8892b" stroke-width=".6"/></svg>linia prosta</span>
  </div>
  <div class="row">
   <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#8a8070" stroke-width="2.2"/></svg>pewne</span>
   <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#bdb3a1" stroke-width="1.6"/></svg>prawdopodobne</span>
   <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#c08a3e" stroke-width="1.8" stroke-dasharray="5 4"/></svg>niepotwierdzone</span>
   <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#b5566f" stroke-width="2"/></svg>małżeństwo</span>
   <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/></svg>krewny?</span>
  </div>
  <div class="row" style="font-size:10px;letter-spacing:.12em;font-weight:600"><span style="color:var(--fleury)">— FLEURY</span><span style="color:var(--zan)">— ZANIEWSKI</span><span style="color:var(--wyg)">— WYGONOWSKI</span><span style="color:var(--inlaw)">— KOLIGACJA</span></div>
  <div class="row" style="color:var(--muted)"><span><span class="badge b-C">✓ C</span>źródło</span><span><span class="badge b-P">≈ P</span>prawdop.</span><span><span class="badge b-H">? H</span>hipoteza</span><span><span class="badge b-FAM">R</span>przekaz rodzinny</span></div>
 </div></div>
<div id="panel"><button class="close" id="close">×</button><div id="pc"></div></div>
<script src="vendor/elk.bundled.js"></script>
<script>
(async function(){
const NS="http://www.w3.org/2000/svg", W=184, H=74, U=8, SG=8, SP=8, RH=26, SH=12, SW=208;
const msg=document.getElementById('msg');
let G; try{ G=await (await fetch('data/graph.json',{cache:'no-store'})).json(); window.__G=G; }catch(e){ msg.textContent='Nie udało się wczytać danych drzewa.'; return; }
if(typeof ELK==='undefined'){ msg.textContent='Nie udało się wczytać silnika układu.'; return; }
const elk=new ELK();
const P=new Map(G.people.map(p=>[p.id,p]));
const E=G.edges.map((e,i)=>({...e,i}));
const st=G.meta.statuses;
const rank={C:4,FAM:3,P:2,H:1,X:0};
const best=a=>a.reduce((m,s)=>rank[s]>rank[m]?s:m,'X');
const isNN=p=>/^NN\b/.test(p.name);
const isHyp=p=>p.status==='H'||p.line==='hyp';
const direct=new Set([G.meta.root]);
(function up(id){E.filter(e=>e.type==='parent_of'&&e.to===id).forEach(e=>{if(!direct.has(e.from)){direct.add(e.from);up(e.from);}})})(G.meta.root);
let showHyp=true, onlyLine=false, sel=null;
const spouseOfLine=p=>E.some(e=>e.type==='spouse_of'&&(e.from===p.id&&direct.has(e.to)||e.to===p.id&&direct.has(e.from)));
const visible=p=>(showHyp||!isHyp(p))&&(!onlyLine||direct.has(p.id)||spouseOfLine(p));
const lineLab={fleury:'FLEURY',zaniewski:'ZANIEWSKI',wygonowski:'WYGONOWSKI',inlaw:'KOLIGACJA',hyp:'HIPOTEZA',root:'ZANIEWSKI'};
const lineCol={fleury:'--fleury',zaniewski:'--zan',wygonowski:'--wyg',inlaw:'--inlaw',hyp:'--hyp',root:'--C'};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const vp=document.getElementById('vp'), gE=document.getElementById('edges'), gU=document.getElementById('unions'), gN=document.getElementById('nodes'), svg=document.getElementById('stage');
const mk=(t,a,p)=>{const el=document.createElementNS(NS,t);for(const k in a) if(a[k]!==undefined&&a[k]!=='') el.setAttribute(k,a[k]); p&&p.appendChild(el); return el;};
let model=null;

function buildGraph(){
  const vis=G.people.filter(visible), V=new Set(vis.map(p=>p.id));
  const minGen=Math.min(...vis.map(p=>p.gen));
  const part=g=>2*(g-minGen);
  const nodes=vis.map((p,i)=>({id:p.id,width:W,height:H,x:i*10,y:part(p.gen)*100}));
  const edges=[]; const unions=new Map(); const meta={};
  const uKey=ids=>'U:'+[...ids].sort().join('+');
  const ensureU=ids=>{const k=uKey(ids); if(!unions.has(k)){const g=Math.max(...ids.map(i=>P.get(i).gen)); unions.set(k,{id:k,members:ids,gen:g}); nodes.push({id:k,width:U,height:U,x:nodes.length*10,y:(part(g)+1)*100});} return k;};
  // marriages
  E.filter(e=>e.type==='spouse_of'&&V.has(e.from)&&V.has(e.to)).forEach(e=>{
    const k=ensureU([e.from,e.to]);
    [e.from,e.to].forEach((m,j)=>{const id='m'+e.i+'_'+j; edges.push({id,sources:[m],targets:[k]}); meta[id]={kind:'spouse',s:e.status,a:m,b:k,e};});
  });
  // children (leaf siblings without known descendants/spouses are stacked vertically)
  const kids=new Set(E.filter(e=>e.type==='parent_of').map(e=>e.to));
  const hasOwn=id=>E.some(e=>V.has(e.to)&&V.has(e.from)&&((e.from===id&&(e.type==='parent_of'||e.type==='possible_parent_of'))||(e.type==='spouse_of'&&(e.from===id||e.to===id))));
  const groups=new Map();
  kids.forEach(c=>{ if(!V.has(c)) return;
    const pe=E.filter(e=>e.type==='parent_of'&&e.to===c&&V.has(e.from));
    if(!pe.length) return;
    const ps=pe.map(e=>e.from);
    const src=ps.length>=2?ensureU(ps.slice(0,2)):ps[0];
    if(!groups.has(src)) groups.set(src,[]);
    groups.get(src).push({c,pe,ps,s:best(pe.map(e=>e.status))});
  });
  const stackOf={}; const stacks=new Map();
  groups.forEach((list,src)=>{
    const leaves=list.filter(x=>!hasOwn(x.c)&&!direct.has(x.c));
    if(leaves.length>=2){
      const sid='S:'+src; const ids=leaves.map(x=>x.c);
      ids.forEach(id=>stackOf[id]=sid);
      stacks.set(sid,{id:sid,members:ids});
      const hgt=SH+leaves.length*RH+8;
      const ni=nodes.findIndex(n=>n.id===ids[0]); const y=nodes[ni].y;
      for(let i=nodes.length-1;i>=0;i--) if(ids.includes(nodes[i].id)) nodes.splice(i,1);
      nodes.push({id:sid,width:SW,height:hgt,x:nodes.length*10,y});
      const id='c'+sid; edges.push({id,sources:[src],targets:[sid]});
      meta[id]={kind:'child',s:best(leaves.map(x=>x.s)),a:src,b:sid,members:[...leaves[0].ps,...ids]};
      list=list.filter(x=>!ids.includes(x.c));
    }
    list.forEach(x=>{const id='c'+x.c; edges.push({id,sources:[src],targets:[x.c]}); meta[id]={kind:'child',s:x.s,a:src,b:x.c,pe:x.pe,members:x.ps};});
  });
  const T=id=>stackOf[id]||id;
  E.filter(e=>(e.type==='possible_parent_of')&&V.has(e.from)&&V.has(e.to)).forEach(e=>{const id='pp'+e.i; edges.push({id,sources:[T(e.from)],targets:[T(e.to)]}); meta[id]={kind:'possible',s:'H',a:e.from,b:e.to,e};});
  E.filter(e=>e.type==='relative_of'&&V.has(e.from)&&V.has(e.to)).forEach(e=>{
    let [a,b]=[e.from,e.to]; if(P.get(a).gen>P.get(b).gen) [a,b]=[b,a];
    if(T(a)===T(b)) return;
    const id='r'+e.i; edges.push({id,sources:[T(a)],targets:[T(b)]}); meta[id]={kind:'relative',s:'H',a,b,e};});
  return {graph:{id:'root',layoutOptions:{
    'elk.algorithm':'layered','elk.direction':'DOWN','elk.edgeRouting':'ORTHOGONAL',
    'elk.layered.layering.strategy':'INTERACTIVE',
    'elk.layered.spacing.nodeNodeBetweenLayers':'34','elk.spacing.nodeNode':'26',
    'elk.layered.spacing.edgeNodeBetweenLayers':'16','elk.layered.spacing.edgeEdgeBetweenLayers':'9',
    'elk.spacing.edgeNode':'14','elk.spacing.edgeEdge':'8',
    'elk.layered.nodePlacement.strategy':'NETWORK_SIMPLEX',
    'elk.layered.crossingMinimization.strategy':'LAYER_SWEEP',
    'elk.layered.considerModelOrder.strategy':'NODES_AND_EDGES',
    'elk.layered.thoroughness':'40','elk.padding':'[top=20,left=20,bottom=20,right=20]'},
    children:nodes,edges},unions,meta,stacks};
}

function rounded(pts,r=7){ let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length-1;i++){const p=pts[i],a=pts[i-1],b=pts[i+1];
    const d1=Math.hypot(p.x-a.x,p.y-a.y), d2=Math.hypot(b.x-p.x,b.y-p.y), rr=Math.min(r,d1/2,d2/2);
    const p1={x:p.x+(a.x-p.x)*rr/d1,y:p.y+(a.y-p.y)*rr/d1}, p2={x:p.x+(b.x-p.x)*rr/d2,y:p.y+(b.y-p.y)*rr/d2};
    d+=` L${p1.x} ${p1.y} Q${p.x} ${p.y} ${p2.x} ${p2.y}`;}
  const l=pts[pts.length-1]; return d+` L${l.x} ${l.y}`; }
function wrap(s,n){const w=s.split(' '),L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>n&&c){L.push(c);c=x}else c=(c+' '+x).trim()});L.push(c);return L.length>2?[L[0],L.slice(1).join(' ').slice(0,n-1)+'…']:L;}

// notched-corner archival frame
function frame(x,y,w,h,r){return `M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 0 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 0 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 0 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 0 ${x+r} ${y}Z`;}
function fitText(t,maxW,minPx){const full=t.textContent;let s=parseFloat(getComputedStyle(t).fontSize);
  while(t.getComputedTextLength()>maxW&&s>minPx){s-=.5;t.style.fontSize=s+'px';}
  let c=full;while(c.length>1&&t.getComputedTextLength()>maxW){c=c.slice(0,-1);t.textContent=c.trimEnd()+'…';}
  return t;}
const textW=t=>t.getComputedTextLength();
async function draw(){ await document.fonts.ready;
  msg.style.display='flex';
  const {graph,unions,meta,stacks}=buildGraph();
  let res; try{ res=await elk.layout(graph); }catch(err){ msg.textContent='Błąd układu: '+err; return; }
  msg.style.display='none';
  gE.innerHTML='';gU.innerHTML='';gN.innerHTML='';
  const pos=new Map(res.children.map(n=>[n.id,n]));
  const inStack=new Set(); const stackRows=[];
  stacks.forEach(s=>{const n=pos.get(s.id); if(!n) return;
    s.members.forEach(id=>inStack.add(id));
    const g=mk('g',{transform:`translate(${n.x},${n.y})`},gU);
    mk('path',{d:frame(0,0,SW,n.height,8),fill:css('--stack'),stroke:css('--line'),'stroke-width':1.1},g);
    mk('path',{d:frame(4,4,SW-8,n.height-8,6),fill:'none',stroke:css('--line'),'stroke-width':.6,'stroke-dasharray':'2 2'},g);
    const t=mk('text',{class:'fl',x:SW/2,y:3,'text-anchor':'middle',fill:css('--muted')},g); t.textContent='DZIECI · '+s.members.length;
    const lw=textW(t)+16; g.insertBefore(mk('rect',{x:SW/2-lw/2,y:-3,width:lw,height:7,fill:css('--bg')}),t);
    const tt=mk('title',{},g); tt.textContent='Dzieci, o których potomkach nic nie wiadomo';
    s.members.forEach((id,i)=>stackRows.push({id,x:n.x,y:n.y+SH+i*RH,last:i===s.members.length-1}));});
  model={pos,meta,unions};
  // edges
  const order={relative:0,possible:1,child:2,spouse:3};
  res.edges.sort((a,b)=>order[meta[a.id].kind]-order[meta[b.id].kind]).forEach(e=>{
    const m=meta[e.id]; const sec=e.sections&&e.sections[0]; if(!sec) return;
    const pts=[sec.startPoint,...(sec.bendPoints||[]),sec.endPoint];
    let stroke=css('--edge'),w=2.2,dash='',cap='butt';
    if(m.kind==='spouse'){stroke=css('--spouse');w=2;dash=m.s==='C'?'':'5 4';}
    else if(m.kind==='relative'){stroke=css('--hyp');w=1.6;dash='1.5 4';cap='round';}
    else if(m.kind==='possible'||m.s==='H'){stroke=css('--edgeH');w=1.8;dash='6 5';}
    else if(m.s==='P'){stroke=css('--edgeP');w=1.6;}
    const onLine=m.kind==='child'&&direct.has(m.b)&&(m.members||[]).some(x=>direct.has(x));
    if(onLine){w+=1;}
    const ends=[m.a,m.b,...(m.members||[])];
    mk('path',{class:'edge','data-ends':ends.join(' '),d:rounded(pts),fill:'none',stroke,'stroke-width':w,'stroke-dasharray':dash,'stroke-linecap':cap},gE);
  });
  // unions
  unions.forEach(u=>{const n=pos.get(u.id); if(!n) return;
    mk('circle',{class:'union','data-ends':u.members.join(' '),cx:n.x+U/2,cy:n.y+U/2,r:4.5,fill:'#fff',stroke:css('--spouse'),'stroke-width':2},gU);});
  // people
  G.people.forEach(p=>{ const n=pos.get(p.id); if(!n||inStack.has(p.id)) return;
    const hyp=isHyp(p)||isNN(p), prob=!hyp&&p.status==='P';
    const g=mk('g',{class:'node '+p.status+(isNN(p)?' NN':''),'data-id':p.id,transform:`translate(${n.x},${n.y})`},gN);
    const col=css(lineCol[p.line]||'--line');
    const dir=direct.has(p.id), cx=W/2, fr=css(dir?'--gold':'--line'), lc=hyp?css('--H'):col;
    mk('path',{class:'box',d:frame(0,0,W,H,8),filter:hyp?'':'url(#sh)',fill:hyp?'url(#hatch)':css('--card'),stroke:hyp?css('--H'):fr,'stroke-width':hyp?1.2:(dir?1.5:1.1),'stroke-dasharray':hyp?'5 4':'','stroke-opacity':prob?.75:1},g);
    if(!hyp) mk('path',{d:frame(4,4,W-8,H-8,6),fill:'none',stroke:fr,'stroke-width':.6,'stroke-opacity':dir?.9:.75},g);
    if(dir) mk('path',{d:`M${cx} ${H-4}l4 4l-4 4l-4 -4z`,fill:css('--gold')},g);
    const lab=hyp?'HIPOTEZA':(lineLab[p.line]||'');
    if(lab){ const lt=mk('text',{class:'fl',x:cx,y:3,'text-anchor':'middle',fill:lc},g); lt.textContent=lab;
      const lw=textW(lt)+16; g.insertBefore(mk('rect',{x:cx-lw/2,y:-3,width:lw,height:7,fill:css('--bg')}),lt);
      mk('circle',{cx:cx-lw/2+3,cy:0,r:1.4,fill:lc},g); mk('circle',{cx:cx+lw/2-3,cy:0,r:1.4,fill:lc},g); }
    const maxW=W-28; let two=false; const t1=mk('text',{class:'nm',x:cx,y:37,'text-anchor':'middle','font-style':hyp?'italic':''},g); t1.textContent=p.name;
    if(textW(t1)>maxW){const w=p.name.split(' '); let best=null;
      for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' '),b=w.slice(i).join(' '),sc=Math.max(a.length,b.length); if(!best||sc<best.sc) best={a,b,sc};}
      if(best){two=true; t1.textContent=best.a; t1.setAttribute('y',29); const t2=mk('text',{class:'nm',x:cx,y:46,'text-anchor':'middle','font-style':hyp?'italic':''},g); t2.textContent=best.b; fitText(t2,maxW,13);}}
    fitText(t1,maxW,13);
    const d=mk('text',{class:'dt',x:cx,y:H-12,'text-anchor':'middle'},g); d.textContent=p.dates||'';
    const parts=(p.dates||'').split(' – ');
    if(textW(d)>W-24&&!two&&parts.length===2){ t1.setAttribute('y',31); d.textContent=parts[0]; d.setAttribute('y',H-23); fitText(d,W-24,9);
      const d2=mk('text',{class:'dt',x:cx,y:H-11,'text-anchor':'middle'},g); d2.textContent='– '+parts[1]; fitText(d2,W-24,9); }
    else fitText(d,W-24,9);
    const ti=mk('title',{},g); ti.textContent=p.name+(p.dates?' · '+p.dates:'');
    // status badge
    const bx=W-1, by=1;
    if(p.status==='C'){mk('circle',{cx:bx,cy:by,r:7,fill:css('--C')},g); mk('path',{d:`M${bx-3.6} ${by} l2.6 2.7 l4.8 -5`,stroke:'#fff','stroke-width':1.7,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},g);}
    else if(p.status==='FAM'){mk('circle',{cx:bx,cy:by,r:7,fill:css('--FAM')},g); const t=mk('text',{x:bx,y:by+3.8,'text-anchor':'middle','font-size':9,'font-weight':700,fill:'#fff'},g); t.textContent='R';}
    else if(p.status==='P'){mk('circle',{cx:bx,cy:by,r:7,fill:css('--P'),opacity:.85},g); const t=mk('text',{x:bx,y:by+4,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'#fff'},g); t.textContent='≈';}
    else {mk('circle',{cx:bx,cy:by,r:7,fill:css('--card'),stroke:css('--H'),'stroke-width':1.6,'stroke-dasharray':'2.5 2'},g); const t=mk('text',{x:bx,y:by+4,'text-anchor':'middle','font-size':11,'font-weight':700,fill:css('--H')},g); t.textContent='?';}
  });
  stackRows.forEach(r=>{const p=P.get(r.id); const hyp=isHyp(p)||isNN(p);
    const g=mk('g',{class:'node row '+p.status,'data-id':p.id,transform:`translate(${r.x},${r.y})`},gN);
    mk('rect',{class:'hit',x:7,y:1,width:SW-14,height:RH-2,rx:6},g);
    const dc={C:css('--C'),FAM:css('--FAM'),P:css('--P')}[p.status];
    if(hyp) mk('circle',{cx:17,cy:RH/2,r:3.2,fill:'#fff',stroke:css('--H'),'stroke-width':1.4,'stroke-dasharray':'2 1.5'},g);
    else mk('circle',{cx:17,cy:RH/2,r:3.2,fill:dc||css('--muted')},g);
    const yrs=(p.dates||'').match(/\d{4}/g); const yt=yrs?yrs.join('–'):'';
    let yw=0; if(yt){const y=mk('text',{class:'ry',x:SW-14,y:RH/2+3.5,'text-anchor':'end'},g); y.textContent=yt; yw=textW(y)+8;}
    const t=mk('text',{class:'rn',x:27,y:RH/2+4,'font-style':hyp?'italic':''},g); t.textContent=p.name; fitText(t,SW-27-14-yw,12);
    if(!r.last) mk('line',{x1:12,x2:SW-12,y1:RH,y2:RH,stroke:css('--line'),'stroke-width':.6},g);
    const ti=mk('title',{},g); ti.textContent=p.name+(p.dates?' · '+p.dates:'');
  });
  highlight();
}

function highlight(){
  const nodes=gN.querySelectorAll('.node'), others=[...gE.querySelectorAll('.edge'),...gU.querySelectorAll('.union')];
  if(!sel){nodes.forEach(n=>n.classList.remove('dim','sel'));others.forEach(e=>e.classList.remove('dim'));return;}
  const nb=new Set([sel]); E.forEach(e=>{if(e.from===sel)nb.add(e.to); if(e.to===sel)nb.add(e.from);});
  nodes.forEach(n=>{n.classList.toggle('dim',!nb.has(n.dataset.id)); n.classList.toggle('sel',n.dataset.id===sel);});
  others.forEach(e=>{const ends=e.dataset.ends.split(' ');e.classList.toggle('dim',!ends.includes(sel));});
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge=s=>`<span class="badge b-${s}">${{C:'✓ C',P:'≈ P',H:'? H',FAM:'R',X:'✗ X'}[s]||s}</span>`;
function srcHtml(a){return (a||[]).map(s=>{const o=G.sources[s]; if(!o) return esc(s); return o.u?`<a href="${esc(o.u)}" target="_blank" rel="noopener">${esc(s)}: ${esc(o.t)}</a>`:`<span>${esc(s)}: ${esc(o.t)}</span>`;}).join(' ');}
function factList(f,q){return f&&f.length?'<ul>'+f.map(x=>`<li class="${q?'q':''}">${badge(x.s)}${esc(x.t)}${x.src&&x.src.length?`<div class="src">${srcHtml(x.src)}</div>`:''}</li>`).join('')+'</ul>':'<div class="sub">brak</div>';}
const relName=(e,id)=>{const out=e.from===id; switch(e.type){case 'parent_of':return out?'dziecko':'rodzic';case 'possible_parent_of':return out?'możliwe dziecko':'możliwy rodzic';case 'spouse_of':return 'małżonek';default:return 'możliwy krewny';}};
function select(id){
  sel=id; const p=P.get(id); highlight();
  const rels=E.filter(e=>e.from===id||e.to===id);
  const conf=p.facts.filter(f=>f.s!=='H'&&f.s!=='X'), q=p.facts.filter(f=>f.s==='H'||f.s==='X');
  document.getElementById('pc').innerHTML=`<h2>${esc(p.name)}</h2><div class="sub">${esc(p.dates||'')}</div>
    <div style="margin-top:8px">${badge(p.status)}<span class="sub">${esc(st[p.status]||'')}${direct.has(id)?' · linia prosta':''}</span></div>
    <h3>Fakty</h3>${factList(conf)}
    <h3>Możliwe gałęzie i pytania</h3>${factList(q,true)}
    <h3>Relacje</h3><ul class="rel">${rels.map(e=>{const o=e.from===id?e.to:e.from, op=P.get(o);
      return `<li>${badge(e.status)}<span class="ty">${relName(e,id)}:</span> <a data-go="${o}">${esc(op?op.name:o)}</a>${e.facts&&e.facts.length?'<div class="src">'+e.facts.map(f=>esc(f.t)+' '+srcHtml(f.src)).join('<br>')+'</div>':''}</li>`;}).join('')}</ul>
    <div class="sub" style="margin-top:14px;font-size:11px">ID: ${esc(id)}</div>`;
  document.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{const g=a.dataset.go; if(!visible(P.get(g))){showHyp=true;onlyLine=false;hb.classList.add('on');lb.classList.remove('on');draw().then(()=>{select(g);center(g);});} else {select(g);center(g);}});
  document.getElementById('panel').classList.add('open');
  try{history.replaceState(null,'','#'+id.replace(/_/g,'-'));}catch(e){}
}
function unselect(){sel=null;highlight();document.getElementById('panel').classList.remove('open');try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}

let T={x:0,y:0,k:1}; const apply=()=>vp.setAttribute('transform',`translate(${T.x},${T.y}) scale(${T.k})`);
function bounds(){const ns=G.people.map(p=>model.pos.get(p.id)).filter(Boolean);return{minX:Math.min(...ns.map(n=>n.x)),maxX:Math.max(...ns.map(n=>n.x+W)),minY:Math.min(...ns.map(n=>n.y)),maxY:Math.max(...ns.map(n=>n.y+H))};}
function fit(){const b=bounds(),r=svg.getBoundingClientRect(),top=70,bot=20;
  T.k=Math.min((r.width-40)/(b.maxX-b.minX),(r.height-top-bot)/(b.maxY-b.minY),1.2);
  T.x=(r.width-(b.maxX-b.minX)*T.k)/2-b.minX*T.k; T.y=top+((r.height-top-bot)-(b.maxY-b.minY)*T.k)/2-b.minY*T.k; apply();}
function center(id){const n=model.pos.get(id); if(!n) return; const r=svg.getBoundingClientRect(); T.k=Math.max(T.k,.85);
  const open=document.getElementById('panel').classList.contains('open'), pw=open&&r.width>700?390:0, ph=open&&r.width<=700?r.height*.62:0;
  T.x=(r.width-pw)/2-(n.x+W/2)*T.k; T.y=(r.height-ph)/2+20-(n.y+H/2)*T.k; apply();}
const pts=new Map(); let last=null, moved=false, pinch=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:T.k,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,tx:T.x,ty:T.y};}else last={x:e.clientX,y:e.clientY}; svg.classList.add('drag');});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const k=Math.min(3,Math.max(.12,pinch.k*d/pinch.d));T.x=pinch.mx-(pinch.mx-pinch.tx)*k/pinch.k;T.y=pinch.my-(pinch.my-pinch.ty)*k/pinch.k;T.k=k;apply();moved=true;}
  else if(last){const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;T.x+=dx;T.y+=dy;last={x:e.clientX,y:e.clientY};apply();}});
const end=e=>{ if(e.type==='pointerup'&&!moved&&pts.size===1){const el=document.elementFromPoint(e.clientX,e.clientY);const n=el&&el.closest&&el.closest('g.node'); n?select(n.dataset.id):unselect();}
  pts.delete(e.pointerId); if(pts.size<2)pinch=null; if(!pts.size){last=null;svg.classList.remove('drag');}};
svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;const k=Math.min(3,Math.max(.12,T.k*Math.exp(-e.deltaY*.0015)));T.x=mx-(mx-T.x)*k/T.k;T.y=my-(my-T.y)*k/T.k;T.k=k;apply();},{passive:false});

document.getElementById('fit').onclick=fit;if(!(window.__G&&__G.todo&&__G.todo.length))document.getElementById('todo').style.display='none';
document.getElementById('todo').onclick=()=>{const T=(window.__G&&__G.todo)||[];sel=null;highlight();
 document.getElementById('pc').innerHTML='<h2>Do zrobienia</h2><p style="color:var(--muted);margin:4px 0 0">Rzeczy, których nie da się zrobić automatycznie (VPN, konto, mail, zdjęcia). Resztę wyszukuję sam.</p><h3>Lista</h3><ul class="todo">'+T.map(t=>'<li><span class="tag">'+t.why+'</span>'+t.t+(t.u?' <a href="'+t.u+'" target="_blank" rel="noopener">link</a>':'')+'</li>').join('')+'</ul>';
 document.getElementById('panel').classList.add('open');};

document.getElementById('close').onclick=unselect;
const hb=document.getElementById('hyp'), lb=document.getElementById('line');
hb.onclick=async()=>{showHyp=!showHyp;hb.classList.toggle('on',showHyp);if(sel&&!visible(P.get(sel)))unselect();await draw();fit();};
lb.onclick=async()=>{onlyLine=!onlyLine;lb.classList.toggle('on',onlyLine);if(sel&&!visible(P.get(sel)))unselect();await draw();fit();};
document.getElementById('lt').onclick=e=>{e.preventDefault();const l=document.getElementById('legend');l.classList.toggle('hide');e.target.textContent=l.classList.contains('hide')?'pokaż':'ukryj';};
const dl=document.getElementById('names'); G.people.forEach(p=>{const o=document.createElement('option');o.value=p.name;dl.appendChild(o);});
document.getElementById('q').addEventListener('change',async e=>{const v=e.target.value.toLowerCase();const p=G.people.find(p=>p.name.toLowerCase().includes(v));if(!p)return;if(!visible(p)){showHyp=true;onlyLine=false;hb.classList.add('on');lb.classList.remove('on');await draw();}select(p.id);center(p.id);});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1).replace(/-/g,'_');if(P.has(id)){select(id);center(id);}});

await draw(); fit();
if(innerWidth<700){document.getElementById('legend').classList.add('hide');document.getElementById('lt').textContent='pokaż'; if(T.k<.5){T.k=.6;const n=model.pos.get(G.meta.root),r=svg.getBoundingClientRect();T.x=r.width/2-(n.x+W/2)*T.k;T.y=r.height-110-(n.y)*T.k;apply();}}
const h=location.hash.slice(1).replace(/-/g,'_'); if(P.has(h)){select(h);center(h);}
})();
</script>
